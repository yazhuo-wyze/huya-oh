[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huya-automation"
version = "0.1.0"
description = "Local Edge or Chrome automation for a Huya live room"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.52,<2",
]

[project.scripts]
huya-open-room = "huya_automation.main:main"

[tool.setuptools.packages.find]
where = ["src"]
